name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

# Never cancel: an aborted publish job leaves a draft release without its files.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}

    steps:
      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    strategy:
      matrix:
        include:
          - os: windows-latest
            output: dist/TOTStatsMonitor-Setup.exe
          - os: ubuntu-22.04
            output: dist/TOTStatsMonitor-linux-x86_64
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout released commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'

      # The prebuilt PyInstaller bootloader is shared by every PyInstaller app, so antivirus
      # ML models (Defender's Wacatac.C!ml in particular) flag it. --no-binary alone is not
      # enough: the sdist ships the prebuilt bootloaders too, and only this variable makes
      # the build compile one here. A failed compile fails the install.
      - name: Install dependencies
        env:
          PYINSTALLER_COMPILE_BOOTLOADER: '1'
        run: |
          python -m pip install --upgrade pip
          pip install --no-binary pyinstaller -r requirements-dev.txt

      - name: Install Inno Setup
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }

      - name: Build
        run: python build.py

      - name: Attach to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload ${{ needs.release-please.outputs.tag_name }} ${{ matrix.output }} --clobber

  publish:
    needs: [release-please, build]
    runs-on: ubuntu-latest

    steps:
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release edit ${{ needs.release-please.outputs.tag_name }} --draft=false --latest

  announce:
    needs: [release-please, publish]
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: OutlastTrialsStats/release-announcer@v1
        with:
          webhook-url: ${{ secrets.DISCORD_RELEASE_WEBHOOK }}
          product: TOTStats Monitor
          url: https://outlasttrialsstats.com/projects/monitor
          tag: ${{ needs.release-please.outputs.tag_name }}
