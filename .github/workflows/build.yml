name: Build

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'CHANGELOG.md'
      - '.release-please-manifest.json'
      - 'README.md'
      - 'doc/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install ruff
        run: pip install "$(grep "^ruff==" requirements-dev.txt)"

      - name: Lint
        run: ruff check .

  build:
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            output: dist/TOTStatsMonitor-Setup.exe
          # The oldest runner on offer: a binary links against the glibc it was built with
          # and runs on anything newer.
          - os: ubuntu-22.04
            output: dist/TOTStatsMonitor-linux-x86_64
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'

      # The prebuilt PyInstaller bootloader is shared by every PyInstaller app, so antivirus
      # ML models (Defender's Wacatac.C!ml in particular) flag it. --no-binary alone is not
      # enough: the sdist ships the prebuilt bootloaders too, and only this variable makes
      # the build compile one here. A failed compile fails the install.
      - name: Install dependencies
        env:
          PYINSTALLER_COMPILE_BOOTLOADER: '1'
        run: |
          python -m pip install --upgrade pip
          pip install --no-binary pyinstaller -r requirements-dev.txt

      - name: Test
        run: python -m pytest -q

      - name: Install Inno Setup
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }

      - name: Install Linux build and test dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Build
        id: build
        run: python build.py

      - name: Smoke test the installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'totstats-install'
          Start-Process -Wait -FilePath dist/TOTStatsMonitor-Setup.exe -ArgumentList "/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /TASKS=`"`" /DIR=`"$dir`""
          if (-not (Test-Path "$dir\TOTStatsMonitor.exe")) { throw 'installer did not install the program' }
          $run = Get-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Run' -ErrorAction SilentlyContinue
          if ($run.TOTStatsMonitor) { throw 'autostart was written although the task was not selected' }
          Start-Process -Wait -FilePath "$dir\unins000.exe" -ArgumentList '/VERYSILENT /SUPPRESSMSGBOXES'
          Start-Sleep -Seconds 3
          if (Test-Path "$dir\TOTStatsMonitor.exe") { throw 'uninstaller left the program behind' }

      - name: Smoke test the binary
        if: runner.os == 'Linux'
        run: |
          chmod +x dist/TOTStatsMonitor-linux-x86_64
          dist/TOTStatsMonitor-linux-x86_64 --version
          mkdir -p "$RUNNER_TEMP/logs"
          # A dry run has to start and keep running; timeout ends it with status 124.
          status=0
          timeout 15 xvfb-run -a dist/TOTStatsMonitor-linux-x86_64 --dry-run --silent \
            --logs-dir "$RUNNER_TEMP/logs" || status=$?
          if [ "$status" -ne 124 ]; then echo "dry run exited early with status $status"; exit 1; fi

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: TOTStatsMonitor-v${{ steps.build.outputs.version }}-${{ runner.os }}
          path: ${{ matrix.output }}
          retention-days: 90
