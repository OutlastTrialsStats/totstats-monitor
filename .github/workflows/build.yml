name: Build Windows Executable

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'CHANGELOG.md'
      - '.release-please-manifest.json'
      - 'README.md'
      - 'doc/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install ruff
        run: pip install "$(grep "^ruff==" requirements-dev.txt)"

      - name: Lint
        run: ruff check .

  build:
    needs: lint
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Build executable
        id: build
        run: python build.py

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: TOTStatsMonitor-v${{ steps.build.outputs.version }}
          path: dist/TOTStatsMonitor.exe
          retention-days: 90
